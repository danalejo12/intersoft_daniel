upstream intersoft_app {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 6M;

    # Archivos estáticos recolectados con `manage.py collectstatic`
    location /static/ {
        alias /app/intersoft/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Imágenes subidas por los comercios (servidas sin ejecución de scripts)
    location /media/ {
        alias /app/intersoft/media/;
        expires 7d;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://intersoft_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
    }
}
