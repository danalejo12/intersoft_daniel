<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso restringido · InterSoft</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f8fafc;color:#0f172a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
    main{max-width:480px;width:100%;background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:32px;text-align:center;box-shadow:0 8px 24px rgba(15,23,42,.06)}
    .codigo{display:inline-block;padding:4px 12px;border-radius:999px;background:#fef2f2;color:#dc2626;font-size:13px;font-weight:700;margin-bottom:12px}
    h1{margin:0 0 10px;font-size:24px}
    p{margin:0 0 22px;color:#475569;line-height:1.55}
    .acciones{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
    a{display:inline-block;padding:10px 18px;border-radius:10px;text-decoration:none;font-weight:600;font-size:14px}
    .primario{background:#2563eb;color:#fff}
    .secundario{background:#f1f5f9;color:#0f172a;border:1px solid #cbd5e1}
  </style>
</head>
<body>
  <main>
    <span class="codigo">Error 403</span>
    <h1>No tienes permiso para acceder aquí</h1>
    <p>Tu cuenta o rol actual no cuenta con autorización para ver esta sección de InterSoft.</p>
    <div class="acciones">
      <a class="primario" href="/">Volver al inicio</a>
      <a class="secundario" href="/panel/">Ir al panel</a>
    </div>
  </main>
</body>
</html>
