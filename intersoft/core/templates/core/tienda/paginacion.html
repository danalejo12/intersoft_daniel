{% if page_obj.paginator.num_pages > 1 %}
  {# Conserva búsqueda, categoría y orden al cambiar de página #}
  <nav class="paginacion" aria-label="Páginas">
    {% if page_obj.has_previous %}
      <a class="boton boton-claro" href="?{% if q %}q={{ q|urlencode }}&amp;{% endif %}{% if categoria_activa %}categoria={{ categoria_activa|urlencode }}&amp;{% endif %}{% if orden and orden != 'relevancia' %}orden={{ orden }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">Anterior</a>
    {% endif %}
    <span>Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
      <a class="boton boton-claro" href="?{% if q %}q={{ q|urlencode }}&amp;{% endif %}{% if categoria_activa %}categoria={{ categoria_activa|urlencode }}&amp;{% endif %}{% if orden and orden != 'relevancia' %}orden={{ orden }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Siguiente</a>
    {% endif %}
  </nav>
{% endif %}
