{% load i18n %}<div class="cantidad" data-cantidad>
  <button type="button" data-menos aria-label="{% translate 'Una unidad menos' %}">−</button>
  <input type="number" name="cantidad" value="{{ valor }}" min="1" max="99" inputmode="numeric" aria-label="{% translate 'Cantidad' %}">
  <button type="button" data-mas aria-label="{% translate 'Una unidad más' %}">+</button>
</div>
