<div class="campo{% if campo.errors %} con-error{% endif %}{% if ancho %} campo-ancho{% endif %}">
  {{ campo.label_tag }}
  {{ campo }}
  {% for error in campo.errors %}<p class="error">{% include "core/tienda/icono_error.html" %}<span>{{ error }}</span></p>{% endfor %}
  {% if campo.help_text %}<small class="ayuda">{{ campo.help_text }}</small>{% endif %}
</div>
