{% extends "core/base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}

{% block contenido %}
  <h1>Iniciar sesión</h1>

  {% if form.non_field_errors %}
    <p style="color:red">Correo o contraseña incorrectos.</p>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <p>
      <label for="id_username">Correo</label><br>
      <input type="email" name="username" id="id_username" required autofocus>
    </p>
    <p>
      <label for="id_password">Contraseña</label><br>
      <input type="password" name="password" id="id_password" required>
    </p>
    <!-- Devuelve al usuario a la página que intentaba abrir -->
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Ingresar</button>
  </form>
{% endblock %}
