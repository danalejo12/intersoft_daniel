{% extends "core/base.html" %}
{% block titulo %}Iniciar sesión · Intersoft{% endblock %}

{% block contenido %}
  <section class="login">
    <h1>Intersoft</h1>
    <p class="nota">Ingresa con el correo de tu empresa.</p>

    {% if form.non_field_errors %}
      <p class="error">Correo o contraseña incorrectos.</p>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="campo">
        <label for="id_username">Correo</label>
        <input type="email" name="username" id="id_username" value="{{ form.username.value|default:'' }}" autocomplete="email" required autofocus>
      </div>
      <div class="campo">
        <label for="id_password">Contraseña</label>
        <input type="password" name="password" id="id_password" autocomplete="current-password" required>
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit">Ingresar</button>
    </form>
  </section>
{% endblock %}
