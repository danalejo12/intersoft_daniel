name: Pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          # Base de datos desechable del propio CI: no es un secreto real
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: intersoft
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Valores solo para el CI. Ninguna llave de Wompi: las pruebas usan llaves falsas.
      DJANGO_SECRET_KEY: clave-solo-para-el-ci-no-se-usa-en-ningun-otro-lugar-0123456789
      DEBUG: "False"
      ALLOWED_HOSTS: localhost
      DB_NAME: intersoft
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"

    defaults:
      run:
        working-directory: intersoft

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r ../requirements.txt coverage

      - name: Revisar la configuración
        run: python manage.py check

      - name: Revisar que no falten migraciones
        run: python manage.py makemigrations --check --dry-run

      - name: Pruebas con cobertura (>= 85%)
        run: |
          coverage run --rcfile=.coveragerc manage.py test core suscripciones plataforma pqrs soporte datos_personales --noinput
          coverage report --rcfile=.coveragerc --fail-under=85

  seguridad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Verificar que no haya secretos de producción en el repositorio
        run: |
          if git grep -En "(prv_prod_|prod_integrity_|prod_events_)[A-Za-z0-9]{12,}" -- . ':!.github/workflows/pruebas.yml'; then
            echo "ERROR: Se detectó un posible secreto de producción de Wompi en el repositorio."
            exit 1
          fi

      - name: Análisis estático de seguridad (Bandit)
        run: |
          pip install bandit
          bandit -r intersoft -ll --skip B310,B324 --exclude "intersoft/*/migrations,intersoft/core/tests*.py,intersoft/*/tests*.py"

      - name: Auditoría de vulnerabilidades en dependencias (pip-audit)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
